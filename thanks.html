<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>意見已收到 · 硬核祝福</title>
  <meta name="description" content="多謝你嘅硬核意見。留言已送俾網主。" />
  <style>
    :root {
      --bg: #0a0b0e;
      --text: #e8e6e1;
      --muted: #9a968c;
      --accent: #c9a227;
      --border: #2a2f3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: radial-gradient(ellipse at 30% 20%, #161820 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      padding: 28px 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(18, 20, 26, 0.85);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    h1 em { font-style: normal; color: var(--accent); }
    p {
      margin: 0 0 18px;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--muted);
    }
    a.back {
      display: inline-block;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 10px 18px;
      background: rgba(201, 162, 39, 0.14);
    }
    a.back:hover { filter: brightness(1.12); }
    .brand {
      margin-top: 18px;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.85;
    }
  </style></head>
<body>
  <div class="card">
    <h1>意見<em>已收到</em></h1>
    <p>多謝你嘅硬核祝福。留言已送到網主，唔再淨係留喺你部機。<br />返去繼續打 BOSS。</p>
    <a class="back" href="/">← 返 BOSS 獵殺區</a>
    <div class="brand">HARDCORE BLESSING · 別人改數值，你改規則。</div>
  </div><script src="assets/analytics.js" defer></script>
</body>
</html>
